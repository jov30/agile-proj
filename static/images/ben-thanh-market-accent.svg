<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Ben Thanh Market accent illustration</title>
  <desc id="desc">A stylized illustration of Ben Thanh Market with lanterns and warm Saigon-inspired colours.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1412" />
      <stop offset="50%" stop-color="#2d201b" />
      <stop offset="100%" stop-color="#603426" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd873" />
      <stop offset="100%" stop-color="#ff6a13" />
    </linearGradient>
    <linearGradient id="market" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ead8bf" />
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb5130" />
      <stop offset="100%" stop-color="#9b2b25" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" rx="40" />
  <circle cx="1020" cy="140" r="140" fill="#ffb436" opacity="0.15" />
  <circle cx="180" cy="180" r="120" fill="#006f74" opacity="0.18" />
  <circle cx="920" cy="620" r="180" fill="#d94c79" opacity="0.12" />

  <g fill="#ffb436" opacity="0.22">
    <circle cx="168" cy="118" r="10" />
    <circle cx="214" cy="148" r="8" />
    <circle cx="1006" cy="112" r="11" />
    <circle cx="1038" cy="170" r="7" />
    <circle cx="1110" cy="212" r="9" />
  </g>

  <g filter="url(#softGlow)">
    <circle cx="248" cy="250" r="34" fill="#ff6a13" />
    <circle cx="350" cy="192" r="26" fill="#ffd873" />
    <circle cx="954" cy="252" r="30" fill="#ff6a13" />
    <circle cx="1036" cy="210" r="24" fill="#ffd873" />
  </g>

  <g transform="translate(130 170)">
    <ellipse cx="470" cy="540" rx="420" ry="70" fill="#120d0b" opacity="0.35" />

    <path d="M60 392 L182 256 H330 L270 392 Z" fill="url(#roof)" />
    <path d="M606 392 L666 256 H814 L936 392 Z" fill="url(#roof)" />
    <path d="M274 178 L468 72 L666 178 Z" fill="url(#roof)" />
    <rect x="72" y="392" width="858" height="166" rx="20" fill="url(#market)" />

    <rect x="350" y="178" width="238" height="380" rx="22" fill="url(#market)" />
    <rect x="382" y="210" width="174" height="112" rx="16" fill="#f2ddc0" />
    <circle cx="468" cy="264" r="44" fill="#fff7ed" stroke="#4a3025" stroke-width="12" />
    <line x1="468" y1="264" x2="468" y2="238" stroke="#4a3025" stroke-width="10" stroke-linecap="round" />
    <line x1="468" y1="264" x2="492" y2="280" stroke="#4a3025" stroke-width="10" stroke-linecap="round" />

    <path d="M410 178 L468 128 L526 178 Z" fill="#ffd873" opacity="0.9" />
    <rect x="420" y="340" width="96" height="154" rx="48" fill="#2d201b" opacity="0.9" />
    <path d="M374 494 C412 440 524 440 562 494" fill="none" stroke="#2d201b" stroke-width="12" stroke-linecap="round" />

    <g fill="#2c201b" opacity="0.94">
      <rect x="118" y="442" width="144" height="88" rx="12" />
      <rect x="674" y="442" width="144" height="88" rx="12" />
      <rect x="154" y="344" width="92" height="78" rx="10" />
      <rect x="690" y="344" width="92" height="78" rx="10" />
    </g>

    <g>
      <path d="M88 404 H258 V452 C220 472 126 472 88 452 Z" fill="#ffb436" />
      <path d="M678 404 H848 V452 C810 472 716 472 678 452 Z" fill="#ffb436" />
      <path d="M332 404 H604 V452 C548 474 388 474 332 452 Z" fill="#ffb436" />
    </g>

    <g fill="#fff6e7">
      <rect x="110" y="472" width="126" height="58" rx="12" />
      <rect x="700" y="472" width="126" height="58" rx="12" />
      <rect x="374" y="516" width="188" height="42" rx="18" />
    </g>

    <g transform="translate(42 556)">
      <ellipse cx="88" cy="72" rx="86" ry="52" fill="#b56a2e" />
      <ellipse cx="88" cy="58" rx="86" ry="52" fill="#e4b162" />
      <circle cx="52" cy="54" r="22" fill="#ff9c2f" />
      <circle cx="88" cy="40" r="24" fill="#ffd873" />
      <circle cx="124" cy="56" r="20" fill="#ff6a13" />
    </g>

    <g transform="translate(750 566)">
      <ellipse cx="106" cy="72" rx="98" ry="56" fill="#b56a2e" />
      <ellipse cx="106" cy="58" rx="98" ry="56" fill="#e4b162" />
      <circle cx="70" cy="56" r="24" fill="#28724d" />
      <circle cx="104" cy="44" r="26" fill="#ffd873" />
      <circle cx="144" cy="60" r="22" fill="#ffb436" />
    </g>
  </g>

  <g fill="none" stroke="url(#glow)" stroke-linecap="round">
    <path d="M82 692 C218 638 348 662 470 718" stroke-width="12" opacity="0.6" />
    <path d="M712 722 C842 650 972 652 1128 714" stroke-width="12" opacity="0.45" />
